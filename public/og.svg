<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="AWS Bill Explained — every bill is three meters">
  <defs>
    <radialGradient id="warm" cx="18%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#ff9900" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#ff9900" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cool" cx="88%" cy="6%" r="62%">
      <stop offset="0%" stop-color="#0972d3" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#0972d3" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#232f3e" />
  <rect width="1200" height="630" fill="url(#warm)" />
  <rect width="1200" height="630" fill="url(#cool)" />

  <!-- Wordmark, matching the site header. -->
  <g font-family="'Open Sans','Helvetica Neue',Arial,sans-serif">
    <text x="84" y="104" font-size="30" font-weight="400" fill="#8fa3b8">AWS Bill</text>
    <text x="212" y="104" font-size="30" font-weight="700" fill="#ffffff">Explained</text>

    <!-- The logo is the thesis: one segment per meter. -->
    <rect x="84" y="122" width="46" height="7" rx="2" fill="#ff9900" />
    <rect x="136" y="122" width="46" height="7" rx="2" fill="#0972d3" />
    <rect x="188" y="122" width="46" height="7" rx="2" fill="#d13212" />

    <text x="84" y="288" font-size="94" font-weight="700" fill="#ffffff" letter-spacing="-3">Every bill is</text>
    <text x="84" y="392" font-size="94" font-weight="700" fill="#ff9900" letter-spacing="-3">three meters.</text>

    <text x="84" y="454" font-size="27" font-weight="400" fill="#b9c6d4">
      Time. Bytes. Calls. Learn the three and a pricing page
    </text>
    <text x="84" y="492" font-size="27" font-weight="400" fill="#b9c6d4">
      stops being a lesson and becomes a lookup.
    </text>

    <!-- Odometer wheels, the site's signature object. -->
    <g transform="translate(84 528)">
      <g font-size="42" font-weight="700" font-variant-numeric="tabular-nums">
        <g>
          <rect width="34" height="58" rx="4" fill="#0b1119" stroke="#ffffff" stroke-opacity="0.12" />
          <rect width="34" height="58" rx="4" fill="url(#glass)" />
          <text x="17" y="43" text-anchor="middle" fill="#ff9900">0</text>
        </g>
        <g transform="translate(38 0)">
          <rect width="34" height="58" rx="4" fill="#0b1119" stroke="#ffffff" stroke-opacity="0.12" />
          <rect width="34" height="58" rx="4" fill="url(#glass)" />
          <text x="17" y="43" text-anchor="middle" fill="#ff9900">0</text>
        </g>
        <text x="80" y="46" fill="#5f7183" font-size="34">.</text>
        <g transform="translate(94 0)">
          <rect width="34" height="58" rx="4" fill="#0b1119" stroke="#ffffff" stroke-opacity="0.12" />
          <rect width="34" height="58" rx="4" fill="url(#glass)" />
          <text x="17" y="43" text-anchor="middle" fill="#ff9900">0</text>
        </g>
        <g transform="translate(132 0)">
          <rect width="34" height="58" rx="4" fill="#0b1119" stroke="#ffffff" stroke-opacity="0.12" />
          <rect width="34" height="58" rx="4" fill="url(#glass)" />
          <text x="17" y="43" text-anchor="middle" fill="#ff9900">4</text>
        </g>
        <g transform="translate(170 0)">
          <rect width="34" height="58" rx="4" fill="#0b1119" stroke="#ffffff" stroke-opacity="0.12" />
          <rect width="34" height="58" rx="4" fill="url(#glass)" />
          <text x="17" y="43" text-anchor="middle" fill="#ff9900">7</text>
        </g>
      </g>
      <text x="222" y="38" font-size="19" fill="#8fa3b8">accruing while you read this</text>
    </g>
  </g>
</svg>
