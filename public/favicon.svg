<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="AWS Bill Explained">
  <!--
    Three dials on a dark housing: the same device as the wordmark rule and the
    lamps on every service card. Orange is Time, blue is Bytes, red is Calls.
    At 16px the hues are all that survive, which is the right trade for a
    favicon. This is recognition, not information.
  -->
  <rect width="32" height="32" rx="7" fill="#232f3e" />

  <rect x="4.5" y="8.5" width="7" height="15" rx="2" fill="#0b1119" />
  <rect x="12.5" y="8.5" width="7" height="15" rx="2" fill="#0b1119" />
  <rect x="20.5" y="8.5" width="7" height="15" rx="2" fill="#0b1119" />

  <!-- Each dial reads differently, so it looks like a meter bank rather than
       three identical bars. -->
  <rect x="6" y="17" width="4" height="5" rx="1" fill="#ff9900" />
  <rect x="14" y="12" width="4" height="10" rx="1" fill="#0972d3" />
  <rect x="22" y="15" width="4" height="7" rx="1" fill="#d13212" />
</svg>
