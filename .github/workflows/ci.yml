name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to a commit SHA rather than a tag. A tag is mutable, so
# `@v7` is a promise the upstream repo can quietly rewrite. Dependabot keeps
# the SHA and the trailing version comment in step.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Formatting
        run: npx prettier --check .

      - name: Markdown
        run: npx markdownlint-cli2

      - name: Workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Types
        run: npx astro check

      - name: Domain, layout and catalogue tests
        run: npx vitest run --coverage --coverage.reporter=text-summary --coverage.reporter=html

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The build runs csp-hashes.mjs and check-build.mjs afterwards, which
      # catch SVG geometry, translation gaps and inline scripts the CSP would
      # block — none of which a type checker can see.
      - name: Build and post-build guards
        run: npm run build

      - name: Install the browsers
        run: npx playwright install --with-deps chromium firefox webkit

      # The only step here that opens a page. Everything else in this workflow
      # answers a question about the source; this asks whether the site works.
      # It lives in the build job because it needs the very dist that job just
      # produced, served with the _headers rules applied so the policy under
      # test is the one production sends.
      - name: Smoke tests
        run: npm run test:smoke

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Upload site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Production dependencies are what ships; dev advisories are Dependabot's
      # job on its own schedule rather than a blocker on every pull request.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  sources:
    # Every claim carries an AWS source URL, so a dead citation is a
    # correctness problem here rather than a broken-link nit.
    #
    # This used to carry continue-on-error, which made it green whatever it
    # found — a check nobody reads. The script itself already draws the line:
    # it exits non-zero only on a definite 404/410 and treats timeouts, 403s
    # and redirects as warnings, so the flakiness that flag was guarding
    # against cannot fail the job anyway.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Check cited sources resolve
        run: node scripts/check-sources.mjs

      # A link check asks whether the page is still there. This asks whether
      # anyone has looked at it lately — AWS replaced the entire Support plan
      # lineup without moving a single URL.
      - name: Check how stale the claims are
        run: node scripts/check-freshness.mjs
