name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Types, then the domain and catalogue tests, then the post-build guards
      # that catch SVG geometry a type checker cannot see.
      - run: npx astro check
      - run: npx vitest run
      - run: npm run build
