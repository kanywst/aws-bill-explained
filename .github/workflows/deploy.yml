name: Deploy

on:
  push:
    branches: [main]
  # A manual run is the escape hatch when Cloudflare has swallowed a deploy but
  # nothing in the repo has changed.
  workflow_dispatch:

permissions: {}

# Never let two deploys race for the same environment. In-progress runs finish
# rather than cancel, because a half-uploaded Pages deployment is worse than a
# slightly stale one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Without the token there is nothing to deploy to, and a red main every
    # push teaches people to ignore the colour. Skip loudly instead.
    if: github.event_name == 'workflow_dispatch' || vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://aws-bill-explained.pages.dev
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Deploying past a failing guard would publish a diagram that renders
      # nothing or a claim with no source, so the gates run here too rather
      # than being trusted from the CI workflow.
      - name: Install the browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Types
        run: npx astro check

      - name: Tests
        run: npx vitest run

      - name: Build and post-build guards
        run: npm run build

      # The gate that matters most here, and the one this job used to skip.
      # Everything above answers a question about the source; a page that
      # loads but does nothing passes all of it, which is exactly what shipped.
      - name: Smoke tests against the build
        run: npm run test:smoke

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=aws-bill-explained --branch=main

      # Passing locally is not the same as being served correctly. The defect
      # that prompted these tests was in the response headers, which only the
      # host sends — a local pass could not have seen it. This runs the same
      # tests against what readers actually get.
      - name: Smoke tests against the deployed site
        env:
          SMOKE_BASE_URL: https://aws-bill-explained.pages.dev
        run: |
          sleep 20
          npm run test:smoke
