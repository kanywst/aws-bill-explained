version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    versioning-strategy: increase
    groups:
      # Astro and its integrations move together; separate PRs for each just
      # produce a broken tree that has to be resolved by hand anyway.
      astro:
        patterns:
          - astro
          - '@astrojs/*'
      dev-tooling:
        patterns:
          - vitest
          - prettier
          - prettier-plugin-astro
          - markdownlint-cli2
          - typescript
          - '@astrojs/check'
      fonts:
        patterns:
          - '@fontsource-variable/*'
    ignore:
      # @astrojs/check pins `typescript@^5.0.0 || ^6.0.0`, and 0.9.10 is the
      # latest release, so a TypeScript major lands as an unresolvable peer
      # conflict that fails `npm ci` before any job can run. Reinstate this
      # once @astrojs/check widens the range; minor and patch updates still
      # come through.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    groups:
      # Without this, one round of action bumps arrived as three separate pull
      # requests (#1, #2, #3) that all touched the same workflow file. They
      # move in lockstep and there is no reason to review them apart.
      actions:
        patterns:
          - '*'
    commit-message:
      prefix: chore
      include: scope
